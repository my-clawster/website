<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="ptr-title ptr-desc">
  <title id="ptr-title">Product to Resource model</title>
  <desc id="ptr-desc">Linear flow: offer, product offering, service model, activation map, running claw.</desc>
  <defs>
    <style>.bg{fill:#f7fafc}.cw{fill:#fff;stroke:#d8e0ec;stroke-width:1.5}.cb{fill:#dceeff;stroke:#5c93d6;stroke-width:2}.cd{fill:#17354e}.cg{fill:#fff8e8;stroke:#e6bd62;stroke-width:2}</style>
    <filter id="sh2" x="-8%" y="-15%" width="116%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.10"/></filter>
    <marker id="arr2" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10 z" fill="#6b778c"/></marker>
  </defs>
  <rect class="bg" width="1440" height="500"/>
  <rect fill="#17354e" width="1440" height="110"/>
  <text x="56" y="54" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">Product to Resource</text>
  <text x="56" y="83" font-family="Inter,Arial,sans-serif" font-size="16" fill="#cde1ef">How customer-facing choices turn into a real claw without exposing provider-native IDs.</text>
  <rect class="cb" x="120" y="134" width="180" height="156" rx="16" filter="url(#sh2)"/>
  <text x="210" y="173" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#172033">Offer</text>
  <text x="210" y="195" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">Starter, Pro, Scale,</text>
  <text x="210" y="212" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">Enterprise, and more.</text>
  <text x="210" y="236" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#64748b" font-style="italic">What we sell.</text>
  <line x1="302" y1="212" x2="338" y2="212" stroke="#6b778c" stroke-width="2.4" marker-end="url(#arr2)"/>
  <rect class="cw" x="340" y="134" width="210" height="156" rx="16" filter="url(#sh2)"/>
  <text x="445" y="173" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#172033">Product offering</text>
  <text x="445" y="195" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">The orderable service</text>
  <text x="445" y="212" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">shape users can select</text>
  <text x="445" y="229" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">in the catalog.</text>
  <line x1="552" y1="212" x2="588" y2="212" stroke="#6b778c" stroke-width="2.4" marker-end="url(#arr2)"/>
  <rect class="cd" x="590" y="122" width="260" height="180" rx="16" filter="url(#sh2)"/>
  <text x="720" y="163" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Service model</text>
  <text x="720" y="185" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#cde1ef">Product spec, service spec,</text>
  <text x="720" y="202" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#cde1ef">and option attributes such</text>
  <text x="720" y="219" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#cde1ef">as compute, OS, and region.</text>
  <text x="720" y="244" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#8baabf" font-style="italic">The stable user vocabulary.</text>
  <line x1="852" y1="212" x2="888" y2="212" stroke="#6b778c" stroke-width="2.4" marker-end="url(#arr2)"/>
  <rect class="cg" x="890" y="134" width="220" height="156" rx="16" filter="url(#sh2)"/>
  <text x="1000" y="173" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#172033">Activation map</text>
  <text x="1000" y="195" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">Translates stable options</text>
  <text x="1000" y="212" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">into provider-native values</text>
  <text x="1000" y="229" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">per compatibility rules.</text>
  <line x1="1112" y1="212" x2="1148" y2="212" stroke="#6b778c" stroke-width="2.4" marker-end="url(#arr2)"/>
  <rect class="cd" x="1150" y="134" width="170" height="156" rx="16" filter="url(#sh2)"/>
  <text x="1235" y="173" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Running claw</text>
  <text x="1235" y="195" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#cde1ef">A real resource on</text>
  <text x="1235" y="212" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#cde1ef">the provider infrastructure,</text>
  <text x="1235" y="229" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#cde1ef">tracked and managed.</text>
  <rect fill="#fff" stroke="#d8e0ec" stroke-width="1.5" x="200" y="334" width="1040" height="80" rx="16"/>
  <text x="720" y="365" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#172033">Why this model exists</text>
  <text x="720" y="390" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#526276">Users choose stable service language. Operators manage provider-native mappings. Neither side sees the other IDs.</text>
  <text x="720" y="472" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">The activation map makes the same offer work across providers without changing the user-facing catalog.</text>
</svg>