<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="eb-title eb-desc">
  <title id="eb-title">Extension boundaries</title>
  <desc id="eb-desc">Three-column diagram: my-clawster, my-clawster-packages hub, and enterprise. App shells and boundary rule below.</desc>
  <defs>
    <style>.bg{fill:#f7fafc}.cd{fill:#17354e}.cb{fill:#dceeff;stroke:#5c93d6;stroke-width:2}.cg{fill:#fff8e8;stroke:#e6bd62;stroke-width:2}.cp{fill:#f6efff;stroke:#bca7ec;stroke-width:1.5}</style>
    <filter id="sh5" x="-8%" y="-15%" width="116%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.10"/></filter>
    <marker id="arr5" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10 z" fill="#6b778c"/></marker>
  </defs>
  <rect class="bg" width="1440" height="700"/>
  <rect fill="#17354e" width="1440" height="110"/>
  <text x="56" y="54" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">Packages, plug-ins, UI, and enterprise boundaries</text>
  <text x="56" y="83" font-family="Inter,Arial,sans-serif" font-size="16" fill="#cde1ef">How the platform stays extensible without collapsing every capability into the deployable OSS apps.</text>
  <rect fill="#f0f4f8" stroke="#d8e0ec" stroke-width="1" x="40" y="118" width="1360" height="262" rx="20"/>
  <rect class="cb" x="60" y="130" width="400" height="238" rx="16" filter="url(#sh5)"/>
  <rect fill="#214c6b" stroke="#4e92b2" stroke-width="1.5" x="88" y="154" width="170" height="34" rx="12"/>
  <text x="173" y="177" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#eaf6fb">OSS deploy root</text>
  <text x="260" y="224" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#172033">my-clawster</text>
  <text x="260" y="248" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">Deployable API worker</text>
  <text x="260" y="265" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">and React web shell.</text>
  <text x="260" y="282" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">Consumes packages via</text>
  <text x="260" y="299" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">bun link in local dev,</text>
  <text x="260" y="316" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">npm ranges in production.</text>
  <text x="260" y="342" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#5c93d6" font-weight="700">OSS / Community</text>
  <rect class="cd" x="520" y="130" width="400" height="238" rx="16" filter="url(#sh5)"/>
  <rect fill="#214c6b" stroke="#5ea8c6" stroke-width="1.5" x="548" y="154" width="200" height="34" rx="12"/>
  <text x="648" y="177" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#eaf6fb">Shared packages hub</text>
  <text x="720" y="224" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">my-clawster-packages</text>
  <text x="720" y="248" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#cde1ef">@clawster/core, auth, SDK,</text>
  <text x="720" y="265" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#cde1ef">provider plug-ins, marketplace</text>
  <text x="720" y="282" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#cde1ef">domain, and API client.</text>
  <text x="720" y="299" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#cde1ef">All packages publish here.</text>
  <text x="720" y="316" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#cde1ef">All sibling roots consume here.</text>
  <text x="720" y="342" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#5ea8c6" font-weight="700">OSS / Community / Enterprise</text>
  <rect class="cg" x="980" y="130" width="400" height="238" rx="16" filter="url(#sh5)"/>
  <rect fill="#fff3d8" stroke="#d9a44a" stroke-width="1.5" x="1008" y="154" width="160" height="34" rx="12"/>
  <text x="1088" y="177" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#6d4e1c">Enterprise layer</text>
  <text x="1180" y="224" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#172033">enterprise</text>
  <text x="1180" y="248" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">Admin portal, operator</text>
  <text x="1180" y="265" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">workflows, and enterprise</text>
  <text x="1180" y="282" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">plugins. Extends the OSS</text>
  <text x="1180" y="299" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">core without forking it.</text>
  <text x="1180" y="342" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#d99a26" font-weight="700">Enterprise-only</text>
  <line x1="462" y1="245" x2="518" y2="245" stroke="#6b778c" stroke-width="2.4" marker-end="url(#arr5)"/>
  <line x1="518" y1="255" x2="462" y2="255" stroke="#6b778c" stroke-width="2.4" marker-end="url(#arr5)"/>
  <line x1="922" y1="245" x2="978" y2="245" stroke="#6b778c" stroke-width="2.4" marker-end="url(#arr5)"/>
  <line x1="978" y1="255" x2="922" y2="255" stroke="#6b778c" stroke-width="2.4" marker-end="url(#arr5)"/>
  <rect class="cp" x="60" y="402" width="400" height="140" rx="16" filter="url(#sh5)"/>
  <text x="260" y="444" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#172033">my-clawster-apps</text>
  <text x="260" y="467" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">Private or member-only app shells</text>
  <text x="260" y="484" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">that consume the shared package</text>
  <text x="260" y="501" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#526276">surface. Not part of the OSS repo.</text>
  <text x="260" y="526" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#bca7ec" font-weight="700">Community / Private</text>
  <line x1="260" y1="370" x2="260" y2="400" stroke="#6b778c" stroke-width="2" marker-end="url(#arr5)"/>
  <line x1="720" y1="370" x2="720" y2="400" stroke="#6b778c" stroke-width="2" marker-end="url(#arr5)"/>
  <rect class="cd" x="520" y="402" width="860" height="140" rx="16" filter="url(#sh5)"/>
  <text x="950" y="450" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Boundary rule</text>
  <text x="950" y="474" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#cde1ef">The OSS core stays deployable and understandable without private dependencies.</text>
  <text x="950" y="494" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#cde1ef">Extensions and app shells are layered in through packages and plug-ins,</text>
  <text x="950" y="514" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#cde1ef">not fused into the deployable shell itself.</text>
  <text x="720" y="668" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">The shared packages hub is the only boundary where all sibling roots meet.</text>
</svg>