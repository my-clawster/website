<svg width="960" height="560" viewBox="0 0 960 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid clawster architecture</title>
  <desc id="desc">A hybrid clawster with one primary provider binding and different claw roles distributed across VPS, Kubernetes, and cloud provider paths.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="36" x2="884" y2="522" gradientUnits="userSpaceOnUse">
      <stop stop-color="#122337" />
      <stop offset="1" stop-color="#0B121C" />
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="912" height="512" rx="28" fill="url(#bg)" stroke="#23344F" />
  <rect x="64" y="56" width="154" height="34" rx="17" fill="#47263A" stroke="#A35B73" />
  <text x="141" y="78" text-anchor="middle" fill="#FFD7E2" font-family="Arial, sans-serif" font-size="14">Hybrid example</text>

  <rect x="344" y="132" width="272" height="134" rx="22" fill="#10263B" stroke="#1193B0" stroke-width="2" />
  <text x="480" y="172" text-anchor="middle" fill="#F7FBFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">Clawster orchestration</text>
  <text x="480" y="200" text-anchor="middle" fill="#97ADC3" font-family="Arial, sans-serif" font-size="13">Step 1 creates the primary provider binding</text>
  <text x="480" y="222" text-anchor="middle" fill="#97ADC3" font-family="Arial, sans-serif" font-size="13">Step 2 can route roles to different provider types</text>
  <rect x="392" y="236" width="176" height="26" rx="13" fill="#17354E" stroke="#2C597B" />
  <text x="480" y="254" text-anchor="middle" fill="#C1EBF5" font-family="Arial, sans-serif" font-size="12">shared identity + inventory</text>

  <rect x="88" y="324" width="222" height="150" rx="22" fill="#161E2D" stroke="#C57A5A" />
  <rect x="370" y="324" width="222" height="150" rx="22" fill="#161E2D" stroke="#4E8DB5" />
  <rect x="650" y="324" width="222" height="150" rx="22" fill="#161E2D" stroke="#8C78D5" />

  <text x="199" y="356" text-anchor="middle" fill="#FFD4C3" font-family="Arial, sans-serif" font-size="18" font-weight="700">VPS path</text>
  <text x="199" y="380" text-anchor="middle" fill="#C1AFA7" font-family="Arial, sans-serif" font-size="13">good for gateway or edge claws</text>
  <rect x="130" y="402" width="138" height="42" rx="14" fill="#3C2B28" stroke="#D58B65" />
  <text x="199" y="428" text-anchor="middle" fill="#FFF1EA" font-family="Arial, sans-serif" font-size="12">gateway / ingress</text>

  <text x="481" y="356" text-anchor="middle" fill="#D4EDFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">Kubernetes path</text>
  <text x="481" y="380" text-anchor="middle" fill="#A9BED1" font-family="Arial, sans-serif" font-size="13">good for scalable worker claws</text>
  <rect x="412" y="402" width="138" height="42" rx="14" fill="#213549" stroke="#53A6D4" />
  <text x="481" y="428" text-anchor="middle" fill="#EFF7FD" font-family="Arial, sans-serif" font-size="12">workers / planners</text>

  <text x="761" y="356" text-anchor="middle" fill="#E4D9FF" font-family="Arial, sans-serif" font-size="18" font-weight="700">Cloud path</text>
  <text x="761" y="380" text-anchor="middle" fill="#B9B0D8" font-family="Arial, sans-serif" font-size="13">good for experiments or data-heavy roles</text>
  <rect x="692" y="402" width="138" height="42" rx="14" fill="#2E2847" stroke="#9C88E7" />
  <text x="761" y="428" text-anchor="middle" fill="#F6F1FF" font-family="Arial, sans-serif" font-size="12">research / content</text>

  <path d="M394 266L230 324" stroke="#DA7756" stroke-width="4" stroke-linecap="round" />
  <path d="M480 266V324" stroke="#38BCD7" stroke-width="4" stroke-linecap="round" />
  <path d="M566 266L730 324" stroke="#8F7AE0" stroke-width="4" stroke-linecap="round" />

  <rect x="104" y="128" width="174" height="44" rx="18" fill="#2A2131" stroke="#A35B73" />
  <text x="191" y="156" text-anchor="middle" fill="#FFD6E1" font-family="Arial, sans-serif" font-size="14">one primary provider selected first</text>

  <rect x="154" y="490" width="652" height="24" rx="12" fill="#0C1A29" stroke="#1E3855" />
  <text x="480" y="506" text-anchor="middle" fill="#A4BCD1" font-family="Arial, sans-serif" font-size="12">Hybrid lets each claw role choose a better provider type or binding without splitting the clawster</text>
</svg>